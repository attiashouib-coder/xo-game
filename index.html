<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO Final</title>
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

<div class="box">
  <h1>❌ XO ⭕</h1>

  <!-- الشاشة الرئيسية -->
  <div id="mainMenu">
    <button class="btn btn-yellow" onclick="startOffline()">العب مع صاحبك 🖱️<br><small>على نفس الجهاز</small></button>
    <button class="btn btn-white" onclick="showOnlineMenu()">العب اونلاين مع يوزر 📱<br><small>انت على الكمبيوتر وهو على الموبايل</small></button>
  </div>

  <!-- قائمة الاونلاين -->
  <div id="onlineLobby" style="display:none">
    <p>اونلاين مع يوزر</p>
    <button class="btn btn-yellow" onclick="createRoom()">إنشاء غرفة جديدة ➕</button>
    <p>--- او ---</p>
    <input id="roomInput" placeholder="اكتب كود الغرفة">
    <button class="btn btn-white" onclick="joinRoom()">دخول الغرفة 🚪</button>
    <p id="myIdText" style="display:none">كودك: <b id="roomCode" style="color:#ffe600;font-size:30px"></b><br><small>ابعت الكود ده للي هتلعب معاه على الواتساب</small></p>
    <button class="btn btn-back" onclick="backToMain()">رجوع</button>
  </div>

  <!-- مكان اللعب -->
  <div id="gameArea" style="display:none">
    <div id="info">الغرفة: <b id="roomCodeGame"></b> | انت: <b id="mySym"></b></div>
    <div id="status" class="status">...</div>
    <div id="roundInfo"></div>
    <div class="grid" id="grid"></div>
    <div id="score"></div>
    <button class="btn btn-white" onclick="location.reload()">خروج 🔄</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
